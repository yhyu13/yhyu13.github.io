<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天降筑城 · 千人小镇（离线 Demo）</title>
<style>
:root{--ink:#1e2a36;--accent:#d97b3f;--panel:rgba(250,252,254,.87)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#dbe4ec;color:var(--ink);font:13px/1.55 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
#plan-layer{position:fixed;inset:0;pointer-events:none;opacity:.74}
#plan-layer canvas{display:block}
#hud{position:fixed;left:16px;top:16px;width:246px;padding:14px 16px 12px;border-radius:14px;background:var(--panel);border:1px solid rgba(30,42,54,.09);box-shadow:0 8px 26px rgba(26,42,60,.18)}
#hud h1{margin:0;font-size:15px;letter-spacing:.5px}
#hud .sub{margin:2px 0 11px;font-size:11px;opacity:.6}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:9px 0 3px}
.row>span:first-child,.row>label{opacity:.7}
output{font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0 4px}
input[type=number]{width:106px;padding:3px 6px;border:1px solid rgba(30,42,54,.2);border-radius:7px;font:inherit}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{padding:4px 10px;border:1px solid rgba(30,42,54,.2);border-radius:7px;background:#fff;color:inherit;font:inherit;cursor:pointer}
button:hover{background:#eef4f9}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button.wide{width:100%;margin-top:10px}
.chk{display:flex;align-items:center;gap:7px;margin:7px 0 0}
.tip{margin:11px 0 0;font-size:11px;opacity:.52;line-height:1.5}
#bar{height:3px;border-radius:2px;background:rgba(30,42,54,.12);margin-top:10px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
#stamp{position:fixed;right:16px;bottom:14px;padding:7px 13px;border-radius:10px;background:var(--panel);border:1px solid rgba(30,42,54,.08);box-shadow:0 6px 20px rgba(26,42,60,.14);font-size:12px;letter-spacing:.4px}
#stamp b{color:var(--accent)}
#fatal{position:fixed;inset:0;display:none;place-items:center;padding:40px;text-align:center;background:#e6edf3}</style>
</head>
<body>
<div id="stage"></div>
<div id="plan-layer"></div>
<aside id="hud">
  <h1>天降筑城 · 千人小镇</h1>
  <p class="sub">方块从天而降，落成 14 × 14 的街区</p>
  <div class="row"><span>时刻</span><output id="clock">10:00</output></div>
  <input id="minute" type="range" min="0" max="1439" step="1" value="600" aria-label="模拟分钟">
  <div class="row"><span>流速</span><span class="btns" id="speeds"><button type="button" data-speed="1" class="on">1×</button><button type="button" data-speed="2">2×</button><button type="button" data-speed="4">4×</button></span></div>
  <div class="row"><label for="seed">城市编号</label><input id="seed" type="number" step="1" value="20260818"></div>
  <div class="row btns"><button type="button" id="rebuild">重建小镇</button><button type="button" id="reroll">换一个</button></div>
  <label class="chk"><input id="orbit" type="checkbox"> 自动环绕</label>
  <label class="chk"><input id="planOn" type="checkbox" checked> p5 图纸层</label>
  <button type="button" id="replay" class="wide">重放落块动画</button>
  <div id="bar"><i></i></div>
  <p class="tip">拖拽旋转视角 · 滚轮缩放 · 同一编号必得同一座小镇<br>1 模拟分钟 = 0.625 秒，1 天 = 900 秒</p>
</aside>
<div id="stamp">城市 <b id="stampSeed">20260818</b> · 楼体 <b id="stampB">0</b> 栋 · 地块 <b id="stampT">196</b> 格</div>
<div id="fatal"><p>无法初始化 WebGL 场景，请用支持 WebGL 的现代浏览器打开。</p></div>
<script src="./vendor/three.min.js"></script>
<script src="./vendor/p5.min.js"></script>
<script>
(function () {
'use strict';
/* ================= 1. 常量与纯函数 ================= */
var MINUTES_PER_DAY = 1440;         // 1 天 = 1440 模拟分钟
var SECONDS_PER_SIM_MINUTE = 0.625; // 1 个模拟分钟 = 0.625 秒 → 1 天 = 900 秒
var GRID = 14, CELL = 4, PLOT = GRID * CELL, HALF = PLOT / 2;   // 14 × 14 地块，每格 4 单位
var TILE_H = 0.30, TILE_TOP = 0.30, FLOOR_H = 0.80;
var ROAD_COLS = [3, 8], ROAD_ROWS = [3, 8];  // 路网所在列 / 行
var MAX_TILES = 196, MAX_SLABS = 420, MAX_WINS = 3000;
var DAY_START = 330, DAY_FULL = 420, DUSK_START = 1110, NIGHT_START = 1170;
var PALETTE = [0xe9eef2, 0xdde5ec, 0xcfdae3, 0xc2cfda, 0xf2f5f7, 0xb8c6d2, 0xd6dde4];
var COL_GROUPS = groupRanges(ROAD_COLS), ROW_GROUPS = groupRanges(ROAD_ROWS);
function groupRanges(roads) {
  var out = [], start = 0, i;
  for (i = 0; i < roads.length; i++) { out.push([start, roads[i] - 1]); start = roads[i] + 1; }
  return out.concat([[start, GRID - 1]]);
}function cellX(i) { return (i - (GRID - 1) / 2) * CELL; }
/* mulberry32：同一种子 → 同一座小镇 */
function mulberry32(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var v = s;
    v = Math.imul(v ^ (v >>> 15), v | 1);
    v ^= v + Math.imul(v ^ (v >>> 7), v | 61);
    return ((v ^ (v >>> 14)) >>> 0) / 4294967296;
  };
}
/* daylight(minute)：纯函数，05:30 起渐亮、18:30 起渐暗、19:30 全黑 */
function daylight(minute) {
  var m = ((minute % MINUTES_PER_DAY) + MINUTES_PER_DAY) % MINUTES_PER_DAY;
  if (m < DAY_START || m >= NIGHT_START) return 0;
  if (m < DAY_FULL) return (m - DAY_START) / (DAY_FULL - DAY_START);
  if (m < DUSK_START) return 1;
  return 1 - (m - DUSK_START) / (NIGHT_START - DUSK_START);
}
function fmt(minute) {
  var m = (((minute % MINUTES_PER_DAY) + MINUTES_PER_DAY) % MINUTES_PER_DAY) | 0, h = (m / 60) | 0, r = m % 60;
  return (h < 10 ? '0' : '') + h + ':' + (r < 10 ? '0' : '') + r;
}
/* 下落缓动：先加速后减速，落地瞬间速度归零（C1 连续） */
function easeDrop(p) {

  if (p >= 1) return 1;
  var v = p < 0.7 ? p / 0.7 : (p - 0.7) / 0.3;
  return p < 0.7 ? 0.7 * v * v : 0.7 + 0.3 * (2 * v - v * v);

/* ================= 2. DOM 与场景 ================= */
var $ = function (id) { return document.getElementById(id); };
var stage = $('stage'), clockOut = $('clock'), minuteSlider = $('minute'), seedInput = $('seed'), barFill = $('bar').firstElementChild;
var stampSeed = $('stampSeed'), stampB = $('stampB'), stampT = $('stampT');
var planOn = true, orbitOn = false, speed = 1, currentSeed = 20260818, town = null;
var renderer, scene, camera, hemi, sun, sky, skyGeo, sunDisc, moonDisc;
var groundGeo, groundMesh, tileMesh, slabMesh, winLitMesh, winDarkMesh, rings = [], ringCursor = 0;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); } catch (err) { $('fatal').style.display = 'grid'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdbe4ec, 150, 340);
camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 900);
hemi = new THREE.HemisphereLight(0xcfe0ef, 0x6d6558, 0.9);
scene.add(hemi);
sun = new THREE.DirectionalLight(0xfff2dc, 2.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -42; sun.shadow.camera.right = 42; sun.shadow.camera.top = 42; sun.shadow.camera.bottom = -42;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 300; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.55;
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun); scene.add(sun.target);
/* 天空穹顶：顶点色渐变 */
skyGeo = new THREE.SphereGeometry(420, 26, 18);
skyGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(skyGeo.attributes.position.count * 3), 3));
sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true, fog: false, depthWrite: false, toneMapped: false }));
scene.add(sky);
sunDisc = new THREE.Mesh(new THREE.SphereGeometry(7, 18, 12), new THREE.MeshBasicMaterial({ color: 0xfff3d9, toneMapped: false, fog: false }));
moonDisc = new THREE.Mesh(new THREE.SphereGeometry(5, 18, 12), new THREE.MeshBasicMaterial({ color: 0xdde8f7, toneMapped: false, fog: false }));
scene.add(sunDisc); scene.add(moonDisc);/* 地面：细分平面 + 顶点色 AO（靠近楼体基座处偏暗） */
groundGeo = new THREE.PlaneGeometry(PLOT, PLOT, 84, 84);
groundGeo.rotateX(-Math.PI / 2);
groundGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(groundGeo.attributes.position.count * 3), 3));
groundMesh = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.96, metalness: 0 }));
groundMesh.receiveShadow = true;
scene.add(groundMesh);var boxGeo = new THREE.BoxGeometry(1, 1, 1), planeGeo = new THREE.PlaneGeometry(1, 1);
tileMesh = new THREE.InstancedMesh(boxGeo, new THREE.MeshStandardMaterial({ roughness: 0.9, metalness: 0 }), MAX_TILES);
slabMesh = new THREE.InstancedMesh(boxGeo, new THREE.MeshStandardMaterial({ roughness: 0.78, metalness: 0.02 }), MAX_SLABS);
winLitMesh = new THREE.InstancedMesh(planeGeo, new THREE.MeshStandardMaterial({ color: 0x4a5766, roughness: 0.34, metalness: 0.1, emissive: 0xffb46b, emissiveIntensity: 0 }), MAX_WINS);
winDarkMesh = new THREE.InstancedMesh(planeGeo, new THREE.MeshStandardMaterial({ color: 0x39434f, roughness: 0.4, metalness: 0.05 }), MAX_WINS);
[tileMesh, slabMesh, winLitMesh, winDarkMesh].forEach(function (m) {
  m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false;
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(m);
});
winLitMesh.castShadow = false; winDarkMesh.castShadow = false; winLitMesh.renderOrder = 1; winDarkMesh.renderOrder = 1;
tileMesh.castShadow = false;   // 平铺地块不再自投影，避免阴影痤疮
/* 尘环池：方块落地时扩散消散 */
for (var ri = 0; ri < 26; ri++) {
  var ring = new THREE.Mesh(new THREE.RingGeometry(0.55, 1.0, 22),
    new THREE.MeshBasicMaterial({ color: 0xe8d6bb, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2; ring.visible = false; ring.renderOrder = 2;
  scene.add(ring);
  rings.push({ mesh: ring, age: 0, live: false });
}
/* ================= 3. 城市生成（按城市逻辑落位） ================= */
function pickColor(rnd) {
  if (rnd() < 0.09) return new THREE.Color(0xd97b3f);
  return new THREE.Color(PALETTE[Math.floor(rnd() * PALETTE.length)]);
}
function aoAt(x, z, list) {
  var best = 0, i, b, dx, dz, d, v;
  for (i = 0; i < list.length; i++) {
    b = list[i];
    dx = Math.max(Math.abs(x - b.cx) - b.w / 2, 0);
    dz = Math.max(Math.abs(z - b.cz) - b.d / 2, 0);
    d = Math.sqrt(dx * dx + dz * dz);
    if (d < 2.4) { v = Math.exp(-d / 1.15); if (v > best) best = v; }
  }
  return best;
}
function buildTown(seed) {
  var rnd = mulberry32((seed ^ 0x9E3779B9) >>> 0), colG = [], rowG = [], i, j, row, col;
  for (i = 0; i < COL_GROUPS.length; i++) for (j = COL_GROUPS[i][0]; j <= COL_GROUPS[i][1]; j++) colG[j] = i;
  for (i = 0; i < ROW_GROUPS.length; i++) for (j = ROW_GROUPS[i][0]; j <= ROW_GROUPS[i][1]; j++) rowG[j] = i;
  var park = {}, pk = 1 + (rnd() < 0.45 ? 1 : 0);
  for (i = 0; i < pk; i++) park[Math.floor(rnd() * 3) + '_' + Math.floor(rnd() * 3)] = true;
  /* 地块：道路 / 街坊 / 公园 */
  var cells = [];
  for (row = 0; row < GRID; row++) for (col = 0; col < GRID; col++) {
    var isRoad = ROAD_COLS.indexOf(col) >= 0 || ROAD_ROWS.indexOf(row) >= 0;
    var type = isRoad ? 'road' : (park[colG[col] + '_' + rowG[row]] ? 'park' : 'lot');
    cells.push({ col: col, row: row, x: cellX(col), z: cellX(row), type: type, base: 0, h: TILE_H, squash: 0.24 });
  }
  /* 楼体：先占满临街外圈，再填内部；网格对齐，宽高随机 */
  var used = {}, buildings = [];
  function fits(col, row, w, d, cr, rr) {
    if (col + w - 1 > cr[1] || row + d - 1 > rr[1]) return false;
    for (var a = 0; a < d; a++) for (var b = 0; b < w; b++) if (used[(row + a) + '_' + (col + b)]) return false;
    return true;
  }
  for (var bg = 0; bg < COL_GROUPS.length; bg++) for (var rg = 0; rg < ROW_GROUPS.length; rg++) {
    if (park[bg + '_' + rg]) continue;
    var cr = COL_GROUPS[bg], rr = ROW_GROUPS[rg], list = [];
    for (var r2 = rr[0]; r2 <= rr[1]; r2++) for (var c2 = cr[0]; c2 <= cr[1]; c2++) {
      var edge = (c2 === cr[0] || c2 === cr[1] || r2 === rr[0] || r2 === rr[1]) ? 1 : 0;
      list.push({ col: c2, row: r2, edge: edge, k: rnd() });
    }
    list.sort(function (a, b) { return (b.edge - a.edge) || (a.k - b.k); });
    for (var li = 0; li < list.length; li++) {
      var cell = list[li];
      if (used[cell.row + '_' + cell.col]) continue;
      if (rnd() < 0.12) { used[cell.row + '_' + cell.col] = true; continue; }
      var w = 1 + Math.floor(rnd() * Math.min(3, cr[1] - cell.col + 1));
      var d = 1 + Math.floor(rnd() * Math.min(3, rr[1] - cell.row + 1));
      if (!fits(cell.col, cell.row, w, d, cr, rr)) d = 1;
      if (!fits(cell.col, cell.row, w, d, cr, rr)) w = 1;
      if (!fits(cell.col, cell.row, w, d, cr, rr)) { used[cell.row + '_' + cell.col] = true; continue; }
      for (var a2 = 0; a2 < d; a2++) for (var b2 = 0; b2 < w; b2++) used[(cell.row + a2) + '_' + (cell.col + b2)] = true;
      var cx = (cellX(cell.col) + cellX(cell.col + w - 1)) / 2, cz = (cellX(cell.row) + cellX(cell.row + d - 1)) / 2;
      var central = Math.max(0, 1 - Math.max(Math.abs(cx), Math.abs(cz)) / HALF);
      var floors = Math.max(1, Math.min(14, Math.round((1.6 + 8.6 * central * central) * (0.55 + rnd() * 0.85))));
      buildings.push({ cx: cx, cz: cz, w: (w - 1) * CELL + CELL * 0.84, d: (d - 1) * CELL + CELL * 0.84,
        floors: floors, color: pickColor(rnd), slabs: [], wins: [], doneT: 0, placed: false });
    }
  }
  /* 地标：最靠近市中心的楼体加高，作为天际线锚点 */

  }
  if (buildings.length) {
    buildings[landmark].floors = Math.min(24, Math.round(buildings[landmark].floors * 1.9));

  }

      var shade = b.color.clone().lerp(new THREE.Color(0xffffff), 0.16 * (f / Math.max(1, b.floors - 1)));
      b.slabs.push({ x: b.cx, y: y, z: b.cz, w: b.w, h: FLOOR_H, d: b.d, color: shade, base: TILE_TOP + f * FLOOR_H, squash: 0.2 });

        var faceW = (side < 2) ? b.w : b.d, n = Math.max(1, Math.round(faceW / 2.6));
        for (var k = 0; k < n; k++) {
          var u = ((k + 0.5) / n - 0.5) * faceW * 0.74;
          var win = { w: Math.min(0.6, faceW / n * 0.4), h: FLOOR_H * 0.4, y: y, lit: rnd() < 0.62 };
          if (side === 0) { win.x = b.cx + u; win.z = b.cz + b.d / 2 + 0.05; win.ry = 0; }
          else if (side === 1) { win.x = b.cx + u; win.z = b.cz - b.d / 2 - 0.05; win.ry = Math.PI; }
          else if (side === 2) { win.x = b.cx + b.w / 2 + 0.05; win.z = b.cz + u; win.ry = Math.PI / 2; }

          wins.push(win);

      }

  for (i = 0; i < cells.length; i++) {
    var o = cells[i];

    o.dur = 0.8 + rnd() * 0.4; o.t1 = o.t0 + o.dur;

      var s = buildings[i].slabs[j];

    var cg = COL_GROUPS[bgi], rg2 = ROW_GROUPS[rgi];
    blocks.push({ label: 'ABC'[bgi] + (rgi + 1), cx: (cellX(cg[0]) + cellX(cg[1])) / 2, cz: (cellX(rg2[0]) + cellX(rg2[1])) / 2 });

}
/* ================= 4. 落地、阴影与实例写入 ================= */
var dummy = new THREE.Object3D(), scratchColor = new THREE.Color();
var fallT = 0, settled = false, maxT1 = 0;
function spawnRing(x, z) {
  var r = rings[ringCursor++ % rings.length];
  r.age = 0; r.live = true;
  r.mesh.position.set(x, TILE_TOP + 0.03, z); r.mesh.scale.setScalar(0.7); r.mesh.material.opacity = 0.5; r.mesh.visible = true;
}
function updateRings(dt) {
  for (var i = 0; i < rings.length; i++) {
    var r = rings[i], s;
    if (!r.live) continue;
    r.age += dt; s = 0.7 + r.age * 4.2;
    r.mesh.scale.set(s, s, s);
    r.mesh.material.opacity = Math.max(0, 0.5 * (1 - r.age / 0.55));

/* 写入窗户实例；show=false 时缩到极小（而非 0，避免法线矩阵退化） */
function setWindows(list, show) {
  for (var i = 0; i < list.length; i++) {
    var w = list[i], s = show ? 1 : 0.0001;
    dummy.position.set(w.x, w.y, w.z);
    dummy.rotation.set(0, w.ry, 0);
    dummy.scale.set(show ? w.w : s, show ? w.h : s, 1);

/* 单个落块在某一帧的位置与落地压缩量 */
function fallState(o) {

    q = (fallT - o.t1) / 0.28;
    if (q < 1) sq = 1 - o.squash * Math.sin(Math.PI * Math.max(0, q));
    if (!o.spawned) { o.spawned = true; spawnRing(o.x, o.z); }
  }
  return { y: y, sq: sq };
}
function applyFalls() {
  var i, o, st;
  for (i = 0; i < town.cells.length; i++) {
    o = town.cells[i]; st = fallState(o);
    dummy.position.set(o.x, st.y, o.z); dummy.rotation.set(0, 0, 0);
    dummy.scale.set(CELL * 0.88, o.h * st.sq, CELL * 0.88);
    dummy.updateMatrix();
    tileMesh.setMatrixAt(i, dummy.matrix);
  }
  for (i = 0; i < town.slabs.length; i++) {
    o = town.slabs[i]; st = fallState(o);
    dummy.position.set(o.x, st.y, o.z); dummy.rotation.set(0, 0, 0);
    dummy.scale.set(o.w, o.h * st.sq, o.d);
    dummy.updateMatrix();
    slabMesh.setMatrixAt(i, dummy.matrix);
  }
  tileMesh.instanceMatrix.needsUpdate = true;
  slabMesh.instanceMatrix.needsUpdate = true;
  winLitMesh.instanceMatrix.needsUpdate = true;
  winDarkMesh.instanceMatrix.needsUpdate = true;
  /* 楼体落齐后点亮对应窗户 */
  for (i = 0; i < town.buildings.length; i++) {
    var b = town.buildings[i];
    if (b.placed || fallT < b.doneT) continue;
    b.placed = true;
    setWindows(b.wins, true);
  }
}
/* ================= 5. 昼夜与天光 ================= */
var skyTop = new THREE.Color(0x9fc4e6), skyBot = new THREE.Color(0xe6eef4);
var sunDir = new THREE.Vector3(0, 1, 0), moonDir = new THREE.Vector3(0, -1, 0);
var cTopDay = new THREE.Color(0x8fbde4), cTopNight = new THREE.Color(0x101b2d);
var cBotDay = new THREE.Color(0xe8eff5), cBotNight = new THREE.Color(0x1b2740);
var cDusk = new THREE.Color(0xf0a468), cWarm = new THREE.Color(0xff9a52), cNoon = new THREE.Color(0xfff4e2);
function applyTime(minute) {
  var day = daylight(minute);
  var phase = (minute - DAY_START) / (NIGHT_START - DAY_START) * Math.PI;
  var elev = Math.sin(phase), azim = -1.25 + phase * 0.95, ce = Math.cos(elev * 1.25);
  sunDir.set(Math.cos(azim) * ce, Math.sin(elev * 1.25), Math.sin(azim) * ce).normalize();
  moonDir.copy(sunDir).multiplyScalar(-1);
  var isDay = day > 0.02, dir = isDay ? sunDir : moonDir;
  sun.position.copy(dir).multiplyScalar(120);
  sun.target.position.set(0, 0, 0);
  sun.target.updateMatrixWorld();
  scratchColor.copy(cNoon).lerp(cWarm, Math.max(0, 1 - Math.min(1, day * 1.7)) * 0.85);
  if (!isDay) scratchColor.setHex(0x9fb6dd);
  sun.color.copy(scratchColor);
  sun.intensity = isDay ? (0.4 + 2.3 * day) : 0.30;
  skyTop.copy(cTopNight).lerp(cTopDay, day);
  skyBot.copy(cBotNight).lerp(cBotDay, day);
  var dusk = Math.max(0, 1 - Math.abs(day - 0.22) / 0.22);
  skyBot.lerp(cDusk, dusk * 0.45);
  skyTop.lerp(cDusk, dusk * 0.18);
  hemi.color.copy(skyTop);
  hemi.intensity = 0.3 + 0.95 * day;
  scene.fog.color.copy(skyBot);
  sunDisc.position.copy(sunDir).multiplyScalar(330);
  moonDisc.position.copy(moonDir).multiplyScalar(330);
  sunDisc.visible = isDay; moonDisc.visible = !isDay;
  winLitMesh.material.emissiveIntensity = 0.02 + (1 - day) * (1 - day) * 2.9;
  var pos = skyGeo.attributes.position, col = skyGeo.attributes.color, i;
  for (i = 0; i < pos.count; i++) {
    var t = Math.max(0, Math.min(1, (pos.getY(i) / 420 + 0.06) / 0.86));
    scratchColor.copy(skyBot).lerp(skyTop, t);
    col.setXYZ(i, scratchColor.r, scratchColor.g, scratchColor.b);
  }
  col.needsUpdate = true;
}
/* ================= 6. 相机（自写轨道 + 缩放 + 自动环绕） ================= */
var cam = { theta: 0.72, phi: 0.95, radius: 102, tx: 0, ty: 5, tz: 0 };
var dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', function (e) {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  if (renderer.domElement.setPointerCapture) renderer.domElement.setPointerCapture(e.pointerId);
});
window.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  cam.theta -= (e.clientX - lastX) * 0.005;
  cam.phi -= (e.clientY - lastY) * 0.005;
  cam.phi = Math.max(0.12, Math.min(1.45, cam.phi));
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('pointerup', function () { dragging = false; });
window.addEventListener('pointercancel', function () { dragging = false; });
renderer.domElement.addEventListener('wheel', function (e) {
  e.preventDefault();
  cam.radius = Math.max(26, Math.min(190, cam.radius * (1 + e.deltaY * 0.0012)));
}, { passive: false });
function updateCamera(dt) {
  if (orbitOn && !dragging) cam.theta += dt * 0.1;
  var sp = Math.sin(cam.phi), cp = Math.cos(cam.phi);
  camera.position.set(cam.tx + cam.radius * sp * Math.sin(cam.theta),
    cam.ty + cam.radius * cp, cam.tz + cam.radius * sp * Math.cos(cam.theta));
  camera.lookAt(cam.tx, cam.ty, cam.tz);
}
/* ================= 7. p5 图纸层（失败不影响 3D） ================= */
function initPlan() {
  if (typeof p5 !== 'function') return;
  try {
    new p5(function (p) {
      var v = new THREE.Vector3();
      function proj(x, y, z) {
        v.set(x, y, z).applyMatrix4(camera.matrixWorldInverse);
        if (v.z > -0.05) return null;
        v.applyMatrix4(camera.projectionMatrix);
        return { x: (v.x * 0.5 + 0.5) * p.width, y: (-v.y * 0.5 + 0.5) * p.height };
      }
      function seg(ax, ay, az, bx, by, bz) {
        var a = proj(ax, ay, az), b = proj(bx, by, bz);
        if (!a || !b) return;
        p.line(a.x, a.y, b.x, b.y);
      }
      function label(text, x, y, z, fill) {
        var q = proj(x, y, z);
        if (!q) return;
        p.noStroke(); p.fill(fill[0], fill[1], fill[2], fill[3]);
        p.text(text, q.x, q.y);
      }
      p.setup = function () {
        p.createCanvas(window.innerWidth, window.innerHeight);
        p.pixelDensity(Math.min(2, window.devicePixelRatio || 1));
        p.noStroke();
      };
      p.draw = function () {
        try {
          p.clear();
          if (!planOn || !town) return;
          p.strokeWeight(1);
          p.stroke(96, 168, 196, 42);
          for (var i = 0; i <= GRID; i++) {
            var t = (i - GRID / 2) * CELL;
            seg(t, TILE_TOP + 0.04, -HALF, t, TILE_TOP + 0.04, HALF);
            seg(-HALF, TILE_TOP + 0.04, t, HALF, TILE_TOP + 0.04, t);
          }
          p.stroke(126, 220, 238, 105);
          for (var r = 0; r < ROAD_ROWS.length; r++) seg(-HALF, TILE_TOP + 0.05, cellX(ROAD_ROWS[r]), HALF, TILE_TOP + 0.05, cellX(ROAD_ROWS[r]));
          for (var c = 0; c < ROAD_COLS.length; c++) seg(cellX(ROAD_COLS[c]), TILE_TOP + 0.05, -HALF, cellX(ROAD_COLS[c]), TILE_TOP + 0.05, HALF);
          p.stroke(226, 240, 250, 92);
          for (var bi = 0; bi < town.buildings.length; bi++) {
            var b = town.buildings[bi], ty = TILE_TOP + b.floors * FLOOR_H + 0.15;
            var hx = b.w / 2 + 0.15, hz = b.d / 2 + 0.15;
            seg(b.cx - hx, ty, b.cz - hz, b.cx + hx, ty, b.cz - hz);
            seg(b.cx + hx, ty, b.cz - hz, b.cx + hx, ty, b.cz + hz);
            seg(b.cx + hx, ty, b.cz + hz, b.cx - hx, ty, b.cz + hz);
            seg(b.cx - hx, ty, b.cz + hz, b.cx - hx, ty, b.cz - hz);
          }
          p.textSize(11);
          for (var kb = 0; kb < town.blocks.length; kb++) {
            var blk = town.blocks[kb], lp = proj(blk.cx, TILE_TOP + 0.05, blk.cz);
            if (lp) { p.noStroke(); p.fill(110, 214, 236, 165); p.text(blk.label, lp.x - 8, lp.y + 4); }
          }
          var roadLabels = [['北大街', cellX(ROAD_ROWS[0]), -HALF + 7], ['南大街', cellX(ROAD_ROWS[1]), HALF - 7], ['西环路', -HALF + 7, cellX(ROAD_COLS[0])], ['东环路', HALF - 7, cellX(ROAD_COLS[1])]];
          for (var rl = 0; rl < roadLabels.length; rl++) label(roadLabels[rl][0], roadLabels[rl][1], TILE_TOP + 0.05, roadLabels[rl][2], [255, 206, 148, 200]);
          p.noStroke();
          p.fill(228, 240, 250, 185); p.textSize(12);
          p.text('图纸 · 城市 ' + currentSeed, 18, window.innerHeight - 48);
          p.fill(198, 222, 238, 160); p.textSize(10);
          p.text('14 × 14 街区 · ' + town.buildings.length + ' 栋 · ' + town.cells.length + ' 格', 18, window.innerHeight - 32);
        } catch (err) { /* 图纸层出错时静默跳过，3D 继续渲染 */ }
      };
      p.windowResized = function () { p.resizeCanvas(window.innerWidth, window.innerHeight); };
    }, $('plan-layer'));
  } catch (err) { /* p5 不可用时静默降级，3D 继续渲染 */ }
}
/* ================= 8. 装配与重建 ================= */
function paintGround() {
  var pos = groundGeo.attributes.position, col = groundGeo.attributes.color, roadX = [], roadZ = [], i, k;
  for (i = 0; i < ROAD_COLS.length; i++) roadX.push(cellX(ROAD_COLS[i]));
  for (i = 0; i < ROAD_ROWS.length; i++) roadZ.push(cellX(ROAD_ROWS[i]));
  for (i = 0; i < pos.count; i++) {
    var x = pos.getX(i), z = pos.getZ(i), onRoad = false;
    for (k = 0; k < roadX.length; k++) if (Math.abs(x - roadX[k]) < CELL * 0.55) onRoad = true;
    for (k = 0; k < roadZ.length; k++) if (Math.abs(z - roadZ[k]) < CELL * 0.55) onRoad = true;
    scratchColor.setHex(onRoad ? 0x8d99a6 : 0xb6c2cc);
    scratchColor.multiplyScalar(1 - 0.45 * aoAt(x, z, town.buildings));
    col.setXYZ(i, scratchColor.r, scratchColor.g, scratchColor.b);
  }
  col.needsUpdate = true;
}
function rebuild(seed) {
  currentSeed = seed >>> 0;
  maxT1 = 0;                                  // buildTown 会把最晚落位时刻累加进来
  town = buildTown(currentSeed);
  seedInput.value = currentSeed;
  stampSeed.textContent = currentSeed;
  stampB.textContent = town.buildings.length;
  stampT.textContent = town.cells.length;
  tileMesh.count = town.cells.length;
  slabMesh.count = town.slabs.length;
  for (var i = 0; i < town.cells.length; i++) {
    var o = town.cells[i];
    scratchColor.setHex(o.type === 'road' ? 0x5c6673 : (o.type === 'park' ? 0x9db294 : 0xdfe6ec));
    scratchColor.multiplyScalar(1 - 0.26 * aoAt(o.x, o.z, town.buildings));
    tileMesh.setColorAt(i, scratchColor);
  }
  for (i = 0; i < town.slabs.length; i++) slabMesh.setColorAt(i, town.slabs[i].color);
  if (tileMesh.instanceColor) tileMesh.instanceColor.needsUpdate = true;
  if (slabMesh.instanceColor) slabMesh.instanceColor.needsUpdate = true;
  winLitMesh.count = town.litCount;
  winDarkMesh.count = town.darkCount;
  setWindows(town.wins, false);
  paintGround();
  fallT = 0; settled = false;
  applyFalls();
}/* ================= 9. 主循环 ================= */
var simMinute = 600, last = 0, sliderActive = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (!last) last = now;
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!sliderActive) simMinute = (simMinute + dt * speed / SECONDS_PER_SIM_MINUTE) % MINUTES_PER_DAY;
  clockOut.textContent = fmt(simMinute);
  minuteSlider.value = String(Math.floor(simMinute));
  if (!settled) {
    fallT += dt;
    applyFalls();
    if (fallT > maxT1 + 0.4) settled = true;
  }
  barFill.style.width = (settled ? 100 : Math.min(100, fallT / (maxT1 + 0.4) * 100)) + '%';
  updateRings(dt);
  updateCamera(dt);
  applyTime(simMinute);
  renderer.render(scene, camera);
}
/* ================= 10. 交互绑定 ================= */
minuteSlider.addEventListener('pointerdown', function () { sliderActive = true; });
window.addEventListener('pointerup', function () { sliderActive = false; });
minuteSlider.addEventListener('input', function () { simMinute = parseInt(minuteSlider.value, 10) || 0; });
$('speeds').addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('button') : null;
  if (!b) return;
  speed = parseInt(b.getAttribute('data-speed'), 10) || 1;
  var all = this.querySelectorAll('button'), i;
  for (i = 0; i < all.length; i++) all[i].classList.toggle('on', all[i] === b);
});
$('rebuild').addEventListener('click', function () {
  var v = parseInt(seedInput.value, 10);
  rebuild(isFinite(v) ? v >>> 0 : 20260818);
});$('reroll').addEventListener('click', function () { rebuild((currentSeed * 1664525 + 1013904223) >>> 0); });
$('replay').addEventListener('click', function () {
  var i;
  for (i = 0; i < town.cells.length; i++) town.cells[i].spawned = false;
  for (i = 0; i < town.slabs.length; i++) town.slabs[i].spawned = false;
  for (i = 0; i < town.buildings.length; i++) town.buildings[i].placed = false;
  setWindows(town.wins, false);
  fallT = 0; settled = false;
  applyFalls();
});
$('orbit').addEventListener('change', function () { orbitOn = this.checked; });
$('planOn').addEventListener('change', function () { planOn = this.checked; });
window.addEventListener('resize', function () {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
});
/* ================= 11. 启动 ================= */
(function boot() {
  var q = null;
  try { q = new URLSearchParams(location.search).get('seed'); } catch (err) { q = null; }
  var v = parseInt(q, 10);
  rebuild(isFinite(v) ? v >>> 0 : 20260818);
  initPlan();
  requestAnimationFrame(frame);
})();
})();
</script>
